<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>物語盤 — 付箋ボード</title>
<style>
  :root{
    --bg:#1a1a1e; --panel:#212127; --card:#26262e; --card-hi:#2d2d38; --line:#34343d;
    --text:#e5e5ea; --muted:#9a9aa4; --muted-2:#6b6b74; --shadow:0 6px 18px rgba(0,0,0,.35);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial,
            "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden;}
  button,input{font-family:inherit;color:inherit;}
  button{cursor:pointer;}

  /* HOME */
  #home{position:absolute;inset:0;overflow:auto;display:none;}
  .home-head{padding:20px 26px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2;}
  .home-head .brand{font-size:19px;letter-spacing:.08em;}
  .home-head .brand small{font-size:10px;color:var(--muted-2);letter-spacing:.14em;margin-left:7px;}
  .home-head .spacer{flex:1;}
  .home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding:24px 26px 60px;}
  .board-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;min-height:124px;display:flex;flex-direction:column;gap:10px;cursor:pointer;position:relative;transition:border-color .12s,background .12s;}
  .board-card:hover{border-color:#47474f;background:#23232b;}
  .board-card .bt{font-size:15px;padding-right:26px;word-break:break-word;line-height:1.4;}
  .board-card .bt-input{font-size:15px;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:5px 7px;width:100%;}
  .board-card .bmeta{margin-top:auto;display:flex;align-items:center;gap:10px;color:var(--muted-2);font-size:12px;}
  .dots{display:flex;gap:4px;}
  .dots i{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px rgba(0,0,0,.25) inset;}
  .board-card .more{position:absolute;top:9px;right:9px;background:none;border:none;color:var(--muted-2);font-size:16px;padding:2px 7px;border-radius:6px;line-height:1;}
  .board-card .more:hover{background:rgba(255,255,255,.07);color:var(--text);}
  .add-card{border:1px dashed var(--line);background:transparent;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;border-radius:14px;min-height:124px;}
  .add-card:hover{border-color:#57575f;color:var(--text);background:var(--panel);}

  /* BAR */
  #bar{display:none;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:40;}
  .icnbtn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;}
  .icnbtn:hover{background:var(--card-hi);}
  .icnbtn:disabled{cursor:default;}
  .icnbtn.ghost{background:transparent;}
  .icnbtn.ghost:hover{background:var(--card);}
  #boardTitle{background:transparent;border:1px solid transparent;border-radius:7px;padding:5px 9px;font-size:15px;min-width:110px;max-width:280px;}
  #boardTitle:hover{border-color:var(--line);}
  #boardTitle:focus{border-color:var(--line);background:var(--card);outline:none;}
  .sep{width:1px;height:22px;background:var(--line);}
  #themebar{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0;}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 6px 5px 9px;font-size:12.5px;}
  .chip:hover{background:var(--card-hi);}
  .chip .cd{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.28) inset;flex:none;}
  .chip .cc{color:var(--muted-2);font-size:11px;min-width:16px;text-align:center;background:rgba(255,255,255,.05);border-radius:9px;padding:0 5px;line-height:16px;}
  .chip .cc:hover{background:rgba(255,255,255,.12);color:var(--text);}
  .chip.add{padding:5px 11px;color:var(--muted);}
  .chip[draggable="true"]{cursor:grab;}
  .chip.dragging-chip{opacity:.4;cursor:grabbing;}
  .chip.chip-drop{box-shadow:inset 0 0 0 2px var(--muted);}
  .mode-toggle{display:flex;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .mode-toggle button{background:transparent;border:none;padding:6px 12px;font-size:12.5px;color:var(--muted);}
  .mode-toggle button.on{background:var(--card-hi);color:var(--text);}

  /* STAGE / NOTES */
  #stage{position:absolute;inset:52px 0 0 0;overflow:auto;display:none;}
  #board{position:relative;min-height:100%;min-width:100%;}
  .board-hint{position:absolute;top:16px;left:20px;color:var(--muted-2);font-size:12.5px;pointer-events:none;}
  .board-content{position:absolute;left:0;top:0;}
  .panning,.panning *{cursor:grabbing!important;}
  .note{position:absolute;width:210px;height:auto;min-height:60px;max-height:440px;background:var(--card);border:1px solid var(--line);border-radius:10px;border-left:4px solid var(--accent,#888);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .12s,border-color .12s;}
  .note:hover{border-color:#45454f;}
  .note.pinned{border-left-width:6px;border-color:#484853;}
  .note.dragging{z-index:60;box-shadow:0 14px 30px rgba(0,0,0,.5);transition:none;}
  .note .rz{position:absolute;top:6px;bottom:6px;right:0;width:10px;cursor:ew-resize;z-index:6;}
  .note .rz:hover{background:linear-gradient(to left,rgba(255,255,255,.14),transparent);}
  .note-head{display:flex;align-items:center;gap:2px;height:26px;padding:0 4px 0 8px;cursor:grab;touch-action:none;flex:none;border-bottom:1px solid rgba(255,255,255,.03);}
  .note-head:active{cursor:grabbing;}
  .note-head .dot{width:12px;height:12px;border-radius:50%;border:none;background:var(--accent,#888);padding:0;box-shadow:0 0 0 1px rgba(0,0,0,.3) inset;flex:none;}
  .note-head .spacer{flex:1;}
  .note-head .icn{background:none;border:none;color:var(--muted-2);padding:2px 5px;font-size:12px;line-height:1;border-radius:5px;}
  .note-head .icn:hover{background:rgba(255,255,255,.07);color:var(--text);}
  .note-head .pin.on{color:var(--accent);}
  .stars{display:inline-flex;gap:1px;margin-left:3px;flex:none;}
  .stars .star{background:none;border:none;padding:0 1px;font-size:11px;line-height:1;color:var(--muted-2);cursor:pointer;}
  .stars .star.on{color:#e0c063;}
  .stars .star:hover{color:#e0c063;}
  .nm-head .nm-stars{display:inline-flex;margin-left:8px;}
  .nm-head .nm-stars .star{font-size:20px;padding:2px 3px;}
  .note.link-target{outline:2px solid var(--accent);outline-offset:2px;}
  svg.links{position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:4;}
  svg.links path.wire{fill:none;stroke:#9a9aa4;stroke-width:2;}
  svg.links path.hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer;}
  svg.links.linking path.hit{pointer-events:none;}
  svg.links path.temp{fill:none;stroke:#9a9aa4;stroke-width:2;stroke-dasharray:5 4;pointer-events:none;}
  .note-body{flex:1 1 auto;padding:7px 10px 9px;font-size:13.5px;line-height:1.55;color:var(--text);overflow:hidden;outline:none;word-break:break-word;white-space:pre-wrap;}
  .note-body:focus{overflow:auto;background:rgba(255,255,255,.02);}
  .note-body:empty::before{content:"付箋の内容…";color:var(--muted-2);}
  .note.flash{animation:flash 1.1s ease;}
  @keyframes flash{0%{box-shadow:0 0 0 2px var(--accent),var(--shadow);}100%{box-shadow:var(--shadow);}}

  /* SHUFFLE split */
  #split{position:absolute;inset:52px 0 0 0;display:none;grid-template-columns:1fr 1fr;}
  .pane{overflow:auto;position:relative;border-right:1px solid var(--line);}
  .pane:last-child{border-right:none;}
  .pane-head{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 14px;display:flex;align-items:center;gap:10px;}
  .pane-head .lbl{letter-spacing:.06em;font-size:14px;}
  .pane-head .sub{font-size:11px;color:var(--muted-2);}
  .pane-head .spacer{flex:1;}
  .sboard{position:relative;min-width:100%;min-height:calc(100% - 40px);}
  .sboard .board-hint{top:14px;left:16px;}

  /* popups */
  .pop{position:absolute;z-index:80;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:0 16px 40px rgba(0,0,0,.5);padding:8px;min-width:210px;max-width:300px;}
  .pop h4{margin:2px 6px 8px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;}
  .pop .row{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:7px;cursor:pointer;}
  .pop .row:hover{background:var(--card);}
  .pop .row .rdot{width:11px;height:11px;border-radius:50%;flex:none;}
  .pop .row .rtxt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;}
  .pop .row .rtxt.mut{color:var(--muted-2);font-style:italic;}
  .pop .menu-item{padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;}
  .pop .menu-item:hover{background:var(--card);}
  .pop .menu-item.danger:hover{background:#3a2626;color:#e6a6a6;}
  .pop .div{height:1px;background:var(--line);margin:6px 6px;}
  .pop .tname{flex:1;background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px;font-size:13px;}
  .pop .tname:hover,.pop .tname:focus{border-color:var(--line);background:var(--card);outline:none;}
  .pop .xsm{background:none;border:none;color:var(--muted-2);font-size:14px;padding:2px 5px;border-radius:5px;}
  .pop .xsm:hover{background:rgba(255,255,255,.07);color:var(--text);}
  .pop .swatches{display:flex;flex-wrap:wrap;gap:6px;padding:6px;max-width:200px;}
  .pop .sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.3);cursor:pointer;}
  .pop .sw:hover{transform:scale(1.12);}
  .backdrop{position:fixed;inset:0;z-index:70;}

  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);background:#2b2b34;border:1px solid var(--line);color:var(--text);padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.4);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* 付箋の拡大ポップアップ（スマホ）＝付箋の形のまま大きく */
  #noteModal{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;background:rgba(8,8,12,.5);padding:22px;animation:nmFade .16s ease;}
  #noteModal[hidden]{display:none;}
  @keyframes nmFade{from{opacity:0;}to{opacity:1;}}
  .nm-card{display:flex;flex-direction:column;width:min(420px,82vw);max-height:70vh;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent,#888);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.6);overflow:hidden;animation:nmIn .16s ease;}
  @keyframes nmIn{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
  .nm-head{display:flex;align-items:center;gap:4px;height:40px;padding:0 8px 0 12px;border-bottom:1px solid rgba(255,255,255,.04);flex:none;}
  .nm-head .nm-dot{width:18px;height:18px;border-radius:50%;border:none;padding:0;background:var(--accent,#888);box-shadow:0 0 0 1px rgba(0,0,0,.3) inset;cursor:pointer;}
  .nm-head .nm-spacer{flex:1;}
  .nm-head .nm-ico{background:none;border:none;color:var(--muted-2);font-size:18px;padding:6px 10px;border-radius:7px;line-height:1;}
  .nm-head .nm-ico:hover{background:rgba(255,255,255,.07);color:var(--text);}
  .nm-head .nm-del.armed{color:#e6a6a6;background:#3a2626;font-size:13px;}
  .nm-themebar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel);}
  .nm-themebar .sw{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--line);border-radius:18px;font-size:13.5px;cursor:pointer;background:var(--card);}
  .nm-themebar .sw.on{border-color:var(--muted);}
  .nm-themebar .sw .d{width:13px;height:13px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.3) inset;}
  .nm-body{flex:1;width:100%;min-height:110px;border:none;outline:none;background:transparent;color:var(--text);font-family:var(--sans);font-size:18px;line-height:1.7;padding:14px 16px;resize:none;overflow:auto;touch-action:pan-y;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
  .sync-ui{white-space:nowrap;}
  .sync-ui.dirty{color:#e0b877;border-color:#5a4c2e;}

  /* ===== スマホ対応（4a：画面固定＋ツールバー畳み） ===== */
  html,body{overscroll-behavior:none;}
  .only-mobile{display:none!important;}
  @media (max-width:720px), (max-height:520px){
    .only-mobile{display:inline-flex!important;}
    #bar{gap:6px;padding:6px 8px;flex-wrap:nowrap;overflow:hidden;}
    #themebar{display:none;}
    #bar #undoBtn,#bar #saveBtn,#bar #menuBtn,#bar #syncBar{display:none;}
    #boardTitle{flex:1;min-width:0;max-width:none;font-size:15px;}
    .mode-toggle button{padding:6px 9px;}
    #stage,.pane{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
    .home-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:16px 16px 60px;}
    .home-head{padding:14px 16px;}
    .pop{max-width:calc(100vw - 24px);}
    #board{min-width:0;min-height:0;} /* 縮小表示のためパーセント最小サイズを無効化 */
    #split{grid-template-columns:1fr;} /* シャッフルは1画面（全画面の別画面） */
    .pane .sboard{min-width:0;min-height:0;}
  }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="home">
    <div class="home-head"><div class="brand">物語盤<small>MONOGATARI-BAN</small></div><div class="spacer"></div><button class="icnbtn ghost sync-ui" id="syncHome">☁ ログイン</button><button class="icnbtn ghost" id="homeMenu">⋯</button></div>
    <div class="home-grid" id="homeGrid"></div>
  </div>

  <div id="bar">
    <button class="icnbtn ghost" id="toHome">‹ 一覧</button>
    <button class="icnbtn ghost only-mobile" id="hamburger" title="メニュー">☰</button>
    <input id="boardTitle" value="">
    <div class="sep"></div>
    <div id="themebar"></div>
    <button class="icnbtn ghost" id="undoBtn" title="元に戻す">↶</button>
    <button class="icnbtn" id="saveBtn" title="今すぐ保存">保存</button>
    <div class="mode-toggle" id="modeToggle"><button data-mode="normal" class="on">通常</button><button data-mode="shuffle">シャッフル</button></div>
    <button class="icnbtn ghost sync-ui" id="syncBar">☁ ログイン</button>
    <button class="icnbtn ghost" id="menuBtn">⋯</button>
  </div>
  <div id="stage"><div id="board"></div></div>
  <div id="split"></div>
  <div id="noteModal" hidden>
    <div class="nm-card">
      <div class="nm-head">
        <button class="nm-dot" id="nmDot" title="テーマを変更"></button>
        <span class="nm-stars" id="nmStars"></span>
        <span class="nm-spacer"></span>
        <button class="nm-ico nm-pin" id="nmPin" title="固定">📍</button>
        <button class="nm-ico nm-del" id="nmDel" title="削除">×</button>
      </div>
      <div class="nm-themebar" id="nmThemebar" hidden></div>
      <textarea class="nm-body" id="nmBody" placeholder="付箋の内容…" spellcheck="false"></textarea>
    </div>
  </div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
"use strict";
/* ===== 設定：あなたの Google クライアントID（変更するのはここ1か所だけ） ===== */
const GOOGLE_CLIENT_ID="699186544815-4cmbc9qcch601b77rmj2hlu4sdap25r8.apps.googleusercontent.com";
const DRIVE_SCOPE="https://www.googleapis.com/auth/drive.appdata";
const DRIVE_FILE_NAME="monogatari-ban.json";
/* ========================================================================= */
const L={W:210,H:118};
const PALETTE=["#d08a78","#d0a85f","#8fb87f","#6aa9b5","#9d93c9","#cc8fb0","#a7a86a","#7b91c9","#7fae8f","#c2a0a6","#d98d8d","#8aa0c9"];

let app=null, state=null, mode="normal";
let undoStack=[];
let curMainBoard=null, curShBoard=null;
// ---- 保存先：ブラウザの localStorage（このPC・このブラウザに保存される） ----
const LS_KEY="novelboard_v2";
function lsAvailable(){ try{ const k="__lstest"+Math.random(); localStorage.setItem(k,"1"); localStorage.removeItem(k); return true; }catch(e){ return false; } }
const hasStore=lsAvailable();

const homeEl=document.getElementById("home"), homeGrid=document.getElementById("homeGrid");
const barEl=document.getElementById("bar"), stageEl=document.getElementById("stage"), boardEl=document.getElementById("board");
const splitEl=document.getElementById("split"), themeBar=document.getElementById("themebar"), titleInput=document.getElementById("boardTitle");

const rid=p=>p+Math.random().toString(36).slice(2,8);
const uid=()=>(state.nextId++).toString();
const themeById=id=>state.themes.find(t=>t.id===id);
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const px=(n,pk)=>pk==="sh"?(n.sx==null?30:n.sx):(n.x==null?30:n.x);
const py=(n,pk)=>pk==="sh"?(n.sy==null?30:n.sy):(n.y==null?30:n.y);
function setpos(n,pk,x,y){ if(pk==="sh"){n.sx=x;n.sy=y;}else{n.x=x;n.y=y;} }

/* ---- persistence ---- */
let saveTimer=null;
function save(){ if(hasStore){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(app));}catch(e){}},300); } markDirty(); }
function flushSave(){ clearTimeout(saveTimer); if(hasStore){try{localStorage.setItem(LS_KEY,JSON.stringify(app));}catch(e){}} if(signedIn){ saveToDrive(); } else { toast("保存しました（この端末のみ）"); } }
async function loadApp(){
  if(hasStore){
    try{const r=localStorage.getItem(LS_KEY); if(r){const a=JSON.parse(r); if(a&&a.boards)return a;}}catch(e){}
    try{const o=localStorage.getItem("novelboard"); if(o){const d=JSON.parse(o); if(d&&d.notes)return {boards:[normalizeBoard(d)]};}}catch(e){}
  }
  return null;
}

/* ================= Google Drive 同期 ================= */
let gToken=null, gTokenExp=0, gTokenClient=null, _tokenCb=null, _tokenErr=null;
let signedIn=false, driveFileId=null;
let syncState="idle"; // idle | syncing | offline | reauth | signedout
let baseRev=0;   // この端末が最後にDriveと合わせた版番号
let dirty=false; // Driveへ未保存の変更があるか
const SYNC_LABEL={signedout:"☁ ログイン",syncing:"☁ 通信中…",saved:"☁ 保存済み",dirty:"● 未保存",offline:"☁ オフライン",reauth:"☁ 再ログイン"};

function lsGet(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
function lsSet(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
function lsDel(k){ try{localStorage.removeItem(k);}catch(e){} }
function revOf(o){ return (o&&typeof o.rev==="number")?o.rev:0; }

function setSync(s){ syncState=s; updateSyncUI(); }
function markDirty(){ if(!dirty){ dirty=true; lsSet("novelboard_dirty","1"); } updateSyncUI(); }
function clearDirty(){ dirty=false; lsSet("novelboard_dirty","0"); updateSyncUI(); }
function setBaseRev(r){ baseRev=r||0; lsSet("novelboard_baserev",String(baseRev)); }
function updateSyncUI(){
  let label;
  if(!signedIn){ label=(lsGet("novelboard_signedin")==="1")?SYNC_LABEL.reauth:SYNC_LABEL.signedout; }
  else if(syncState==="syncing") label=SYNC_LABEL.syncing;
  else if(syncState==="offline") label=SYNC_LABEL.offline;
  else if(syncState==="reauth") label=SYNC_LABEL.reauth;
  else label=dirty?SYNC_LABEL.dirty:SYNC_LABEL.saved;
  document.querySelectorAll(".sync-ui").forEach(b=>{ b.textContent=label; b.title="Googleドライブ保存"; b.classList.toggle("dirty", signedIn&&dirty&&syncState!=="syncing"); });
}

function waitForGIS(ms){ return new Promise((res,rej)=>{ const t0=Date.now(); (function chk(){ if(window.google&&google.accounts&&google.accounts.oauth2)return res(); if(Date.now()-t0>ms)return rej(new Error("gis-timeout")); setTimeout(chk,150); })(); }); }
function ensureTokenClient(){
  if(gTokenClient)return gTokenClient;
  if(!(window.google&&google.accounts&&google.accounts.oauth2))return null;
  gTokenClient=google.accounts.oauth2.initTokenClient({ client_id:GOOGLE_CLIENT_ID, scope:DRIVE_SCOPE,
    callback:r=>{ if(_tokenCb)_tokenCb(r); }, error_callback:e=>{ if(_tokenErr)_tokenErr(e); } });
  return gTokenClient;
}
async function requestToken(silent){
  await waitForGIS(8000); const client=ensureTokenClient(); if(!client)throw new Error("gis-unavailable");
  return new Promise((resolve,reject)=>{
    _tokenCb=r=>{ if(r&&r.error){reject(r);return;} gToken=r.access_token; gTokenExp=Date.now()+(((r.expires_in||3600)-60)*1000); resolve(gToken); };
    _tokenErr=e=>reject(e);
    try{ client.requestAccessToken(silent?{prompt:""}:{}); }catch(e){ reject(e); }
  });
}
async function getToken(){ if(gToken&&Date.now()<gTokenExp)return gToken; return await requestToken(true); }
async function driveFetch(url,opts,retry){
  const token=await getToken(); opts=opts||{}; opts.headers=Object.assign({},opts.headers,{Authorization:"Bearer "+token});
  const res=await fetch(url,opts);
  if(res.status===401&&!retry){ gToken=null; return driveFetch(url,opts,true); }
  return res;
}
async function driveFindFile(){
  const q=encodeURIComponent("name='"+DRIVE_FILE_NAME+"'");
  const res=await driveFetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name)&q="+q);
  if(!res.ok)throw new Error("list-failed"); const data=await res.json(); return (data.files&&data.files[0])||null;
}
async function driveUpload(id,obj){
  const res=await driveFetch("https://www.googleapis.com/upload/drive/v3/files/"+id+"?uploadType=media",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(obj)});
  if(!res.ok)throw new Error("upload-failed"); return true;
}
async function driveCreateFile(obj){
  const meta={name:DRIVE_FILE_NAME,parents:["appDataFolder"]};
  const res=await driveFetch("https://www.googleapis.com/drive/v3/files?fields=id",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(meta)});
  if(!res.ok)throw new Error("create-failed"); const j=await res.json(); await driveUpload(j.id,obj); return j.id;
}
async function driveDownload(id){
  const res=await driveFetch("https://www.googleapis.com/drive/v3/files/"+id+"?alt=media");
  if(!res.ok)throw new Error("download-failed"); return await res.json();
}
function applyRemote(remote){
  if(!remote||!Array.isArray(remote.boards))return false;
  remote.boards.forEach(normalizeBoard);
  const curId=state&&state.id; app=remote; lsSet(LS_KEY,JSON.stringify(app));
  if(homeEl.style.display!=="none"){ renderHome(); }
  else if(curId&&app.boards.find(b=>b.id===curId)){ openBoard(curId); }
  else goHome();
  return true;
}
/* 起動時：Driveの最新を取り込む（未保存の変更があるときだけ競合確認） */
async function pullOnStart(){
  let file=driveFileId?{id:driveFileId}:await driveFindFile();
  if(!file){ // Driveにまだ無い → この端末の内容を初回保存
    app.rev=(baseRev||0)+1; app.savedAt=new Date().toISOString(); lsSet(LS_KEY,JSON.stringify(app));
    driveFileId=await driveCreateFile(app); lsSet("novelboard_drivefileid",driveFileId); setBaseRev(app.rev); clearDirty(); return;
  }
  driveFileId=file.id; lsSet("novelboard_drivefileid",file.id);
  const remote=await driveDownload(file.id); const rRev=revOf(remote);
  if(!dirty){ applyRemote(remote); setBaseRev(rRev); clearDirty(); return; } // 未保存が無ければ最新を取り込む
  if(rRev<=baseRev) return;   // Driveは自分が知る版のまま → ローカルの未保存を保持
  askConflict(remote,rRev);   // 両方が変わっている → 競合確認
}
/* 保存ボタン：この端末の内容をDriveへ（競合チェックつき） */
async function saveToDrive(){
  if(!signedIn){ toast("保存しました（この端末のみ）"); return; }
  setSync("syncing");
  try{
    let file=driveFileId?{id:driveFileId}:await driveFindFile();
    if(!file){
      app.rev=(baseRev||0)+1; app.savedAt=new Date().toISOString(); lsSet(LS_KEY,JSON.stringify(app));
      driveFileId=await driveCreateFile(app); lsSet("novelboard_drivefileid",driveFileId);
      setBaseRev(app.rev); clearDirty(); setSync("idle"); toast("Driveに保存しました"); return;
    }
    driveFileId=file.id; lsSet("novelboard_drivefileid",file.id);
    const remote=await driveDownload(file.id); const rRev=revOf(remote);
    if(rRev>baseRev){ setSync("idle"); askConflict(remote,rRev); return; } // 他端末が先に更新 → 確認
    app.rev=Math.max(revOf(app),baseRev)+1; app.savedAt=new Date().toISOString(); lsSet(LS_KEY,JSON.stringify(app));
    await driveUpload(file.id,app);
    setBaseRev(app.rev); clearDirty(); setSync("idle"); toast("Driveに保存しました");
  }catch(e){ setSync(navigator.onLine?"reauth":"offline"); toast("Driveに保存できませんでした"); }
}
/* 最新を取り込む（手動） */
async function pullFromDrive(){
  if(!signedIn)return; setSync("syncing");
  try{
    let file=driveFileId?{id:driveFileId}:await driveFindFile();
    if(!file){ setSync("idle"); toast("Driveにまだ保存がありません"); return; }
    driveFileId=file.id;
    const remote=await driveDownload(file.id); const rRev=revOf(remote);
    if(dirty && rRev>baseRev){ setSync("idle"); askConflict(remote,rRev); return; }
    applyRemote(remote); setBaseRev(rRev); clearDirty(); setSync("idle"); toast("Driveの最新を取り込みました");
  }catch(e){ setSync(navigator.onLine?"reauth":"offline"); toast("取り込めませんでした"); }
}
/* 競合ダイアログ（古い版で上書きしそうな時に確認） */
function askConflict(remote,rRev){
  closePop(); const p=makePop();
  p.style.maxWidth="330px"; p.style.left="50%"; p.style.top="50%"; p.style.transform="translate(-50%,-50%)";
  const when=remote&&remote.savedAt?new Date(remote.savedAt).toLocaleString():"不明";
  p.innerHTML='<h4>Driveに新しい版があります</h4><div style="padding:2px 8px 10px;color:var(--muted);font-size:12.5px;line-height:1.65;">他の端末が更新しています（更新: '+esc(when)+'）。この端末の内容で上書きすると、その更新は消えます。</div>';
  const a=document.createElement("div"); a.className="menu-item"; a.textContent="この端末の内容で上書き保存";
  a.addEventListener("click",async()=>{ closePop(); setSync("syncing"); try{ app.rev=rRev+1; app.savedAt=new Date().toISOString(); lsSet(LS_KEY,JSON.stringify(app)); await driveUpload(driveFileId,app); setBaseRev(app.rev); clearDirty(); setSync("idle"); toast("この端末の内容で保存しました"); }catch(e){ setSync("reauth"); toast("保存できませんでした"); } });
  const b=document.createElement("div"); b.className="menu-item"; b.textContent="Driveの最新を取り込む（この端末の未保存は破棄）";
  b.addEventListener("click",()=>{ closePop(); applyRemote(remote); setBaseRev(rRev); clearDirty(); setSync("idle"); toast("Driveの最新を取り込みました"); });
  const div=document.createElement("div"); div.className="div";
  const c=document.createElement("div"); c.className="menu-item"; c.textContent="キャンセル"; c.addEventListener("click",closePop);
  p.appendChild(a); p.appendChild(b); p.appendChild(div); p.appendChild(c);
}
async function signIn(){
  setSync("syncing");
  try{ await requestToken(false); signedIn=true; lsSet("novelboard_signedin","1"); await pullOnStart(); setSync("idle"); toast("Googleドライブに接続しました"); }
  catch(e){ signedIn=false; setSync(navigator.onLine?"signedout":"offline"); if(!(e&&(e.type==="popup_closed"||e.error==="popup_closed_by_user"))) toast("ログインできませんでした"); }
  updateSyncUI();
}
function signOut(){
  if(gToken&&window.google&&google.accounts&&google.accounts.oauth2){ try{google.accounts.oauth2.revoke(gToken);}catch(e){} }
  gToken=null; gTokenExp=0; signedIn=false; driveFileId=null; lsDel("novelboard_signedin"); lsDel("novelboard_drivefileid");
  setSync("signedout"); toast("ログアウトしました（この端末の内容は残ります）");
}
async function resumeSync(){
  if(lsGet("novelboard_signedin")!=="1"){ setSync("signedout"); return; }
  driveFileId=lsGet("novelboard_drivefileid")||null; setSync("syncing");
  try{ await requestToken(true); signedIn=true; await pullOnStart(); setSync("idle"); }
  catch(e){ signedIn=false; setSync(navigator.onLine?"reauth":"offline"); }
}
function onSyncClick(e){ if(signedIn)openSyncMenu(e.currentTarget); else signIn(); }

/* ---- undo / toast ---- */
function snapshot(){ return JSON.stringify({notes:state.notes,themes:state.themes,title:state.title,links:state.links||[]}); }
function pushUndo(snap){ undoStack.push(snap); if(undoStack.length>80)undoStack.shift(); updateUndoBtn(); }
function doUndo(){ if(!undoStack.length)return; const s=JSON.parse(undoStack.pop()); state.notes=s.notes; state.themes=s.themes; state.title=s.title; state.links=s.links||[]; titleInput.value=state.title; save(); updateUndoBtn(); refresh(); }
function updateUndoBtn(){ const b=document.getElementById("undoBtn"); if(b){ b.disabled=!undoStack.length; b.style.opacity=undoStack.length?"1":".4"; } }
let toastTimer=null;
function toast(msg){ let t=document.getElementById("toast"); if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);} t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1400); }

/* ---- board factory ---- */
function starterThemes(){return [{id:rid("t"),name:"アイデア",color:"#d0a85f"},{id:rid("t"),name:"場面",color:"#6aa9b5"},{id:rid("t"),name:"キャラ",color:"#8fb87f"}];}
function freshBoard(title){return {id:rid("b"),title:title||"無題のボード",themes:starterThemes(),notes:[],links:[],nextId:1,spawn:0};}
function sampleBoard(){
  const themes=[{id:rid("t"),name:"メイン",color:"#d08a78"},{id:rid("t"),name:"伏線",color:"#d0a85f"},{id:rid("t"),name:"キャラ",color:"#8fb87f"},{id:rid("t"),name:"場面",color:"#6aa9b5"}];
  const b={id:rid("b"),title:"サンプル：物語の下書き",themes,notes:[],links:[],nextId:1,spawn:0};
  const A=(text,ti,x,y,pin)=>b.notes.push({id:(b.nextId++).toString(),text,themeId:themes[ti].id,pinned:!!pin,x,y});
  A("冒頭：雨の街に降り立つ",3,40,40,true); A("駅で見知らぬ手紙を拾う",0,300,60,false);
  A("十年ぶりの再会",2,110,210,false); A("友人の不自然な態度",1,390,230,false);
  A("差出人は友人だった",0,230,380,false); A("雨を各章の変わり目に散らす？",1,560,410,false);
  b.links=[{id:rid("l"),from:"1",to:"2"},{id:rid("l"),from:"2",to:"3"},{id:rid("l"),from:"3",to:"4"}];

function normalizeBoard(b){
  b.id=b.id||rid("b"); b.title=b.title||"無題のボード";
  b.themes=(b.themes&&b.themes.length)?b.themes:starterThemes(); b.nextId=b.nextId||1; b.spawn=b.spawn||0; b.links=b.links||[];
  b.notes=(b.notes||[]).map((n,i)=>{ if(!n.x&&!n.y){n.x=30+(i%4)*235;n.y=30+Math.floor(i/4)*150;} return {id:n.id||(b.nextId++).toString(),text:n.text||"",themeId:(b.themes.find(t=>t.id===n.themeId)?n.themeId:b.themes[0].id),pinned:!!n.pinned,x:n.x,y:n.y,sx:n.sx,sy:n.sy,srot:n.srot,w:n.w,stars:n.stars||0}; });
  return b;
}

function goHome(){ mode="normal"; state=null; undoStack=[]; closePop(); homeEl.style.display="block"; barEl.style.display="none"; stageEl.style.display="none"; splitEl.style.display="none"; renderHome(); }

function inlineRename(b,card){

function openBoard(id){ state=app.boards.find(b=>b.id===id); if(!state)return; if(!state.links)state.links=[]; mode="normal"; undoStack=[]; closePop(); homeEl.style.display="none"; barEl.style.display="flex"; render(); centerBoard(); }

titleInput.addEventListener("input",()=>{ if(state){ state.title=titleInput.value; save(); }});

function render(){
  if(!state)return;
  titleInput.value=state.title; renderThemeBar(); updateUndoBtn();
  document.querySelectorAll("#modeToggle button").forEach(x=>x.classList.toggle("on",x.dataset.mode===mode));
  if(mode==="shuffle"){ stageEl.style.display="none"; splitEl.style.display="grid"; renderShuffle(); }
  else{ splitEl.style.display="none"; stageEl.style.display="block"; renderNormal(); }
}
function refresh(){ if(!state)return; renderThemeBar(); updateUndoBtn(); if(mode==="shuffle") renderShuffle(); else renderNormal(); }

function renderThemeBar(){
  themeBar.innerHTML="";
  state.themes.forEach(t=>{
    const count=state.notes.filter(n=>n.themeId===t.id).length;
    const chip=document.createElement("div"); chip.className="chip"; chip.title="クリックで「"+t.name+"」の付箋を追加／右クリック（長押し）で編集";
    chip.innerHTML='<span class="cd" style="background:'+t.color+'"></span><span class="cn">'+esc(t.name)+'</span><span class="cc" title="一覧を見る">'+count+'</span>';
    chip.addEventListener("click",e=>{ if(e.target.classList.contains("cc")){e.stopPropagation();openThemeList(t,chip);return;} addNoteOfTheme(t.id); });
    chip.addEventListener("contextmenu",e=>{ e.preventDefault(); openThemeChipMenu(t,e.clientX,e.clientY); });
    let clp; chip.addEventListener("touchstart",e=>{ clp=setTimeout(()=>{const tt=e.touches[0]; if(tt)openThemeChipMenu(t,tt.clientX,tt.clientY);},500); },{passive:true});
    chip.addEventListener("touchend",()=>clearTimeout(clp)); chip.addEventListener("touchmove",()=>clearTimeout(clp));
    // ドラッグで並べ替え（PC）
    chip.draggable=true;
    chip.addEventListener("dragstart",e=>{ e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",t.id); chip.classList.add("dragging-chip"); });
    chip.addEventListener("dragend",()=>{ chip.classList.remove("dragging-chip"); themeBar.querySelectorAll(".chip-drop").forEach(c=>c.classList.remove("chip-drop")); });
    chip.addEventListener("dragover",e=>{ e.preventDefault(); e.dataTransfer.dropEffect="move"; chip.classList.add("chip-drop"); });
    chip.addEventListener("dragleave",()=>chip.classList.remove("chip-drop"));
    chip.addEventListener("drop",e=>{ e.preventDefault(); chip.classList.remove("chip-drop"); reorderTheme(e.dataTransfer.getData("text/plain"),t.id,e.clientX,chip); });
    themeBar.appendChild(chip);
  });
  const add=document.createElement("div"); add.className="chip add"; add.textContent="＋ テーマ"; add.title="テーマを追加・編集";
  add.addEventListener("click",e=>openThemeEditor(e.currentTarget)); themeBar.appendChild(add);
}
function reorderTheme(srcId,targetId,clientX,targetEl){
  if(!srcId||srcId===targetId)return;
  const from=state.themes.findIndex(t=>t.id===srcId); if(from<0)return;
  const rect=targetEl.getBoundingClientRect(); const after=clientX>rect.left+rect.width/2;
  pushUndo(snapshot());
  const [moved]=state.themes.splice(from,1);
  const to=state.themes.findIndex(t=>t.id===targetId);
  state.themes.splice(after?to+1:to,0,moved);
  save(); renderThemeBar();
}

    body.addEventListener("paste",e=>{ e.preventDefault(); const t=(e.clipboardData||window.clipboardData).getData("text"); document.execCommand("insertText",false,t); });
    el.querySelector(".note-head").addEventListener("pointerdown",e=>{ if(e.button&&e.button!==0)return; if(e.target.closest("button"))return; startDrag(e,n,el,pk); });
    el.addEventListener("contextmenu",e=>{ e.preventDefault(); openNoteMenu(n,e.clientX,e.clientY); });
    let lp; el.addEventListener("touchstart",e=>{ lp=setTimeout(()=>{const t=e.touches[0]; if(t)openNoteMenu(n,t.clientX,t.clientY);},500); },{passive:true});

function makeStars(n,onchange){
  const wrap=document.createElement("span"); wrap.className="stars";
  for(let i=1;i<=3;i++){ const b=document.createElement("button"); b.className="star"+((n.stars||0)>=i?" on":""); b.textContent=(n.stars||0)>=i?"★":"☆"; b.title="重要度 ★"+i;
    b.addEventListener("click",e=>{ e.stopPropagation(); const cur=n.stars||0, nv=(cur===i)?i-1:i; pushUndo(snapshot()); n.stars=nv; save(); if(onchange)onchange(); });
    wrap.appendChild(b); }
  return wrap;
}
function startResize(e,n,el,pk){
  if(e.button&&e.button!==0)return;
  e.preventDefault(); e.stopPropagation();
  const before=snapshot(), sx=e.clientX, ow=el.offsetWidth;
  try{el.setPointerCapture(e.pointerId);}catch(_){}
  function mv(ev){ const w=Math.max(150,Math.min(560, ow+(ev.clientX-sx))); n.w=Math.round(w); el.style.width=n.w+"px"; noteSizes[n.id]={w:el.offsetWidth,h:el.offsetHeight}; if(pk==="main"){ const b=el.parentElement, svg=b&&b.querySelector("svg.links"); if(svg)drawLinks(svg,"main"); } }
  function up(){ document.removeEventListener("pointermove",mv); document.removeEventListener("pointerup",up); noteSizes[n.id]={w:el.offsetWidth,h:el.offsetHeight}; pushUndo(before); save(); growBoard(pk); }
  document.addEventListener("pointermove",mv); document.addEventListener("pointerup",up);

/* スマホ：付箋全体で「タップ=全画面編集 / ドラッグ=移動」を判定 */
function attachMobileNote(el,n,pk){
  el.addEventListener("pointerdown",e=>{
    if(e.button&&e.button!==0)return;
    if(e.target.closest("button"))return; // ヘッダーの各ボタンは従来どおり
    e.preventDefault();
    const startX=e.clientX, startY=e.clientY, oL=px(n,pk), oT=py(n,pk);
    const z=zoomOf(el); const mc=minCoord();
    const before=(pk==="main")?snapshot():null;
    let dragging=false, aborted=false;
    try{el.setPointerCapture(e.pointerId);}catch(_){}
    function mv(ev){
      if(pinchActive){ aborted=true; if(dragging){ el.classList.remove("dragging"); setpos(n,pk,oL,oT); el.style.left=oL+"px"; el.style.top=oT+"px"; dragging=false; } return; } // ピンチ中は付箋を動かさない
      const dx=ev.clientX-startX, dy=ev.clientY-startY;
      if(!dragging && Math.hypot(dx,dy)>8){ dragging=true; el.classList.add("dragging"); }
      if(dragging){
        const nx=Math.max(mc,oL+dx/z), ny=Math.max(mc,oT+dy/z);
        el.style.left=nx+"px"; el.style.top=ny+"px"; setpos(n,pk,Math.round(nx),Math.round(ny));
        if(pk==="main"){ const b=el.parentElement, svg=b&&b.querySelector("svg.links"); if(svg)drawLinks(svg,"main"); }
      }
    }
    function up(){
      document.removeEventListener("pointermove",mv); document.removeEventListener("pointerup",up);
      el.classList.remove("dragging");
      if(aborted){ /* ピンチに移行したので何もしない */ }
      else if(dragging){ if(pk==="main"&&before)pushUndo(before); save(); growBoard(pk); }
      else { openNoteFullscreen(n); }
    }
    document.addEventListener("pointermove",mv); document.addEventListener("pointerup",up);
  });
}
function startDrag(e,n,el,pk){
  e.preventDefault();

  const sx=e.clientX, sy=e.clientY, oL=px(n,pk), oT=py(n,pk);
  const z=zoomOf(el); const mc=minCoord(); // 縮小補正＋置ける最小座標
  el.classList.add("dragging"); try{el.setPointerCapture(e.pointerId);}catch(_){}
  function mv(ev){ const nx=Math.max(mc,oL+(ev.clientX-sx)/z), ny=Math.max(mc,oT+(ev.clientY-sy)/z); el.style.left=nx+"px"; el.style.top=ny+"px"; if(pk==="main"){ setpos(n,"main",Math.round(nx),Math.round(ny)); const b=el.parentElement, svg=b&&b.querySelector("svg.links"); if(svg)drawLinks(svg,"main"); } }
  function up(){
    document.removeEventListener("pointermove",mv); document.removeEventListener("pointerup",up); el.classList.remove("dragging");
    setpos(n,pk,Math.round(Math.max(mc,parseFloat(el.style.left)||0)),Math.round(Math.max(mc,parseFloat(el.style.top)||0)));

const noteSizes={}; // id -> {w,h}（描画後に実測。矢印・盤サイズ計算で使う）
function nW(n){ const s=noteSizes[n.id]; return (s&&s.w)||(n.w||L.W); }
function nH(n){ const s=noteSizes[n.id]; return (s&&s.h)||L.H; }
// ---- 無限キャンバス：通常画面だけ上下左右に余白(ORIGIN)を持たせ、上や左にも付箋を置ける ----
const ORIGIN=1000;
function boardOrigin(){ return mode==="normal"?ORIGIN:0; }
function minCoord(){ return -Math.max(0, boardOrigin()-40); } // 付箋を置ける最小座標（画面外にはみ出さない範囲）
function zoomOf(el){ const b=el&&el.closest&&el.closest("#board,.sboard"); return b?(parseFloat(b.style.zoom)||1):1; }
function sizeBoard(div,pk){ const O=boardOrigin(); let w=div.clientWidth||600,h=div.clientHeight||400; state.notes.forEach(n=>{ w=Math.max(w,O+px(n,pk)+nW(n)+O); h=Math.max(h,O+py(n,pk)+nH(n)+O); }); div.style.width=Math.max(w,O*2+200)+"px"; div.style.height=Math.max(h,O*2+200)+"px"; }
function growBoard(pk){ const div=pk==="sh"?curShBoard:curMainBoard; if(div)sizeBoard(div,pk); }
function centerBoard(){ if(mode!=="normal")return; const t=Math.max(0, ORIGIN*currentZoom()-80); stageEl.scrollLeft=t; stageEl.scrollTop=t; }
// 中ボタン(ホイール押し込み)ドラッグで画面を自由に移動
function attachPan(scroller){
  scroller.addEventListener("mousedown",e=>{ if(e.button===1)e.preventDefault(); }); // 中クリックのオートスクロール抑止
  scroller.addEventListener("pointerdown",e=>{
    if(e.button!==1)return; e.preventDefault();
    const sx=e.clientX, sy=e.clientY, sl=scroller.scrollLeft, st=scroller.scrollTop;
    scroller.classList.add("panning");
    function mv(ev){ scroller.scrollLeft=sl-(ev.clientX-sx); scroller.scrollTop=st-(ev.clientY-sy); }
    function up(){ document.removeEventListener("pointermove",mv); document.removeEventListener("pointerup",up); scroller.classList.remove("panning"); }
    document.addEventListener("pointermove",mv); document.addEventListener("pointerup",up);

function renderInto(div,pk,hintText){
  div.style.zoom=""; // 実測は等倍で（ズームは呼び出し側で後掛け）
  div.innerHTML="";
  const O=boardOrigin();
  const wrap=document.createElement("div"); wrap.className="board-content"; wrap.style.left=O+"px"; wrap.style.top=O+"px"; div.appendChild(wrap);
  let svg=null;
  if(pk==="main"){ svg=makeArrowSvg(); wrap.appendChild(svg); }
  if(!state.notes.length && hintText){ const h=document.createElement("div"); h.className="board-hint"; h.textContent=hintText; wrap.appendChild(h); }
  state.notes.forEach(n=>{ const el=noteEl(n,pk); el.style.left=px(n,pk)+"px"; el.style.top=py(n,pk)+"px"; if(n.w)el.style.width=n.w+"px"; if(pk==="sh"&&n.srot)el.style.transform="rotate("+n.srot+"deg)"; wrap.appendChild(el); noteSizes[n.id]={w:el.offsetWidth,h:el.offsetHeight}; });
  sizeBoard(div,pk);

}
function isMobileView(){ return window.matchMedia("(max-width:720px)").matches || window.matchMedia("(max-height:520px)").matches; }
function computeBoardZoom(){
  if(!isMobileView()) return 1;
  const across = window.matchMedia("(orientation: landscape)").matches ? 5 : 3; // 縦=横3枚 / 横=横5枚
  const w = document.documentElement.clientWidth || window.innerWidth || 375;
  return Math.max(0.4, Math.min(1, w/(across*L.W)));
}
let pinchActive=false, userBoardZoom=null; // userBoardZoom=ピンチで決めた倍率（未設定なら自動フィット）
function currentZoom(){ return isMobileView() ? (userBoardZoom||computeBoardZoom()) : 1; }
function applyBoardZoom(){ boardEl.style.zoom = isMobileView() ? currentZoom() : ""; }
/* ピンチ中はスクロールを止めて拡大、指を離したらスクロール可（scroller=スクロールする器, getBoard=拡大する盤） */
function attachPinchZoom(scroller, getBoard){
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  let startDist=0, baseZoom=1;
  scroller.addEventListener("touchstart",e=>{
    if(!isMobileView())return;
    if(e.touches.length>=2){ pinchActive=true; startDist=dist(e.touches)||1; baseZoom=parseFloat(getBoard().style.zoom)||computeBoardZoom(); scroller.style.overflow="hidden"; scroller.style.touchAction="none"; e.preventDefault(); }
  },{passive:false});
  scroller.addEventListener("touchmove",e=>{
    if(!pinchActive)return;
    e.preventDefault();
    if(e.touches.length>=2){ let z=baseZoom*(dist(e.touches)/startDist); z=Math.max(0.25,Math.min(2.2,z)); userBoardZoom=z; getBoard().style.zoom=z; }
  },{passive:false});
  function end(e){ if(!pinchActive)return; if(e.touches.length===0){ pinchActive=false; scroller.style.overflow=""; scroller.style.touchAction=""; } else { e.preventDefault(); } }
  scroller.addEventListener("touchend",end,{passive:false});
  scroller.addEventListener("touchcancel",end,{passive:false});
}
function renderNormal(){
  curMainBoard=boardEl;
  renderInto(boardEl,"main","上の色をクリックで付箋を追加。ドラッグで移動、ピンで固定、右クリック（長押し）でテーマ変更・削除。");
  applyBoardZoom();
}

/* ---- add notes ---- */
function viewCenterLogical(board,scroller){ // 今見えている中央を論理座標で返す
  const wrap=board&&board.querySelector(".board-content");
  const sr=(scroller||stageEl).getBoundingClientRect();
  const z=(board&&parseFloat(board.style.zoom))||1;
  if(!wrap){ return {x:(sr.width/2)/z,y:(sr.height/3)/z,z}; }
  const wr=wrap.getBoundingClientRect();
  return {x:(sr.left+sr.width/2-wr.left)/z, y:(sr.top+Math.min(sr.height/2,sr.height/3+40)-wr.top)/z, z};
}
function addNoteOfTheme(themeId){
  pushUndo(snapshot());

  const scroller=(mode==="shuffle"&&curMainBoard)?curMainBoard.parentElement:stageEl;
  const board=(mode==="shuffle"&&curMainBoard)?curMainBoard:boardEl;
  const c=viewCenterLogical(board,scroller); const k=(state.spawn++)%7, mc=minCoord();
  n.x=Math.round(Math.max(mc,c.x-L.W/2+k*18)); n.y=Math.round(Math.max(mc,c.y+k*18));
  const s=scatterSlot(state.notes.length); n.sx=s.x; n.sy=s.y; n.srot=s.rot;
  state.notes.push(n); save(); refresh(); focusNote(n.id);
}
function addAt(pk,x,y){

  if(pk==="sh"){ n.sx=Math.max(0,x-L.W/2); n.sy=Math.max(0,y-20); n.srot=Math.random()*8-4; const k=(state.spawn++)%7; n.x=30+k*18; n.y=30+k*18; }
  else{ const mc=minCoord(); n.x=Math.max(mc,x-L.W/2); n.y=Math.max(mc,y-20); const s=scatterSlot(state.notes.length); n.sx=s.x; n.sy=s.y; n.srot=s.rot; }
  state.notes.push(n); save(); refresh(); focusNote(n.id);

function focusNote(id){ if(isMobileView()){ const n=state.notes.find(x=>x.id===id); if(n){ openNoteFullscreen(n); return; } } const el=document.querySelector('.note[data-id="'+id+'"] .note-body'); if(el)el.focus(); }

stageEl.addEventListener("dblclick",e=>dblAddOn(boardEl,"main",e));
attachPan(stageEl);

/* ================= ARROWS (links) ================= */
const SVGNS="http://www.w3.org/2000/svg";
function makeArrowSvg(){
  const svg=document.createElementNS(SVGNS,"svg"); svg.setAttribute("class","links");
  const defs=document.createElementNS(SVGNS,"defs"); defs.setAttribute("class","mkdefs"); svg.appendChild(defs);
  return svg;
}
function colorMarker(defs,id,color){
  const marker=document.createElementNS(SVGNS,"marker");
  marker.setAttribute("id",id); marker.setAttribute("markerWidth","9"); marker.setAttribute("markerHeight","9");
  marker.setAttribute("refX","7"); marker.setAttribute("refY","3"); marker.setAttribute("orient","auto"); marker.setAttribute("markerUnits","userSpaceOnUse");
  const mp=document.createElementNS(SVGNS,"path"); mp.setAttribute("d","M0,0 L7,3 L0,6 Z"); mp.setAttribute("fill",color);
  marker.appendChild(mp); defs.appendChild(marker);
}
function anchor(n,pk,toward){
  const w=nW(n),h=nH(n), x=px(n,pk),y=py(n,pk),cx=x+w/2,cy=y+h/2, dx=toward.x-cx, dy=toward.y-cy;
  if(Math.abs(dx)>=Math.abs(dy)) return dx>=0?{x:x+w,y:cy,nx:1,ny:0}:{x:x,y:cy,nx:-1,ny:0};
  return dy>=0?{x:cx,y:y+h,nx:0,ny:1}:{x:cx,y:y,nx:0,ny:-1};
}
function bez(A,c1,c2,B,t){ const m=1-t; return {x:m*m*m*A.x+3*m*m*t*c1.x+3*m*t*t*c2.x+t*t*t*B.x, y:m*m*m*A.y+3*m*m*t*c1.y+3*m*t*t*c2.y+t*t*t*B.y}; }
function curveCollisions(A,c1,c2,B,obst){
  let c=0; const pad=14;
  for(let i=1;i<=18;i++){ const p=bez(A,c1,c2,B,i/19);
    for(const o of obst){ if(p.x>o.x-pad&&p.x<o.x+o.w+pad&&p.y>o.y-pad&&p.y<o.y+o.h+pad){ c++; break; } } }
  return c;
}
function pathFor(a,b,pk){
  const ca={x:px(a,pk)+nW(a)/2,y:py(a,pk)+nH(a)/2}, cb={x:px(b,pk)+nW(b)/2,y:py(b,pk)+nH(b)/2};
  const A=anchor(a,pk,cb), B=anchor(b,pk,ca);
  const base=Math.max(45,Math.min(150,Math.hypot(B.x-A.x,B.y-A.y)*0.45));
  const dx=B.x-A.x, dy=B.y-A.y, len=Math.hypot(dx,dy)||1, perpx=-dy/len, perpy=dx/len;
  const obst=state.notes.filter(n=>n.id!==a.id&&n.id!==b.id).map(n=>({x:px(n,pk),y:py(n,pk),w:nW(n),h:nH(n)}));
  const cands=[0,55,-55,110,-110,170,-170,240,-240,320,-320];
  let best=null;
  for(const off of cands){
    const c1={x:A.x+A.nx*base+perpx*off, y:A.y+A.ny*base+perpy*off};
    const c2={x:B.x+B.nx*base+perpx*off, y:B.y+B.ny*base+perpy*off};
    const col=curveCollisions(A,c1,c2,B,obst);
    const d="M "+A.x+" "+A.y+" C "+c1.x+" "+c1.y+" "+c2.x+" "+c2.y+" "+B.x+" "+B.y;
    if(col===0) return d;
    if(!best||col<best.col) best={d,col};
  }
  return best.d;
}
function tempPath(a,pk,cur){
  const A=anchor(a,pk,cur);
  const k=Math.max(30,Math.min(120,Math.hypot(cur.x-A.x,cur.y-A.y)*0.4));
  return "M "+A.x+" "+A.y+" C "+(A.x+A.nx*k)+" "+(A.y+A.ny*k)+" "+cur.x+" "+cur.y+" "+cur.x+" "+cur.y;
}
function drawLinks(svg,pk){
  const defs=svg.querySelector("defs.mkdefs"); if(defs)defs.innerHTML="";
  [...svg.querySelectorAll("path.wire,path.hit")].forEach(p=>p.remove());
  (state.links||[]).forEach((link,i)=>{
    const a=state.notes.find(n=>n.id===link.from), b=state.notes.find(n=>n.id===link.to);
    if(!a||!b)return;
    const th=themeById(b.themeId), color=th?th.color:"#9a9aa4";
    const mk="ah"+i+Math.random().toString(36).slice(2,5); colorMarker(defs,mk,color);
    const d=pathFor(a,b,pk);

    hit.addEventListener("click",e=>{ e.stopPropagation(); openLinkMenu(link,e.clientX,e.clientY); });

function startLink(e,src,el,pk){

  svg.classList.add("linking");

/* ================= SHUFFLE ================= */
function scatterSlot(i,total){
  total=total||Math.max(1,state.notes.length);
  const cols=Math.max(2,Math.ceil(Math.sqrt(total*1.3))), cellW=L.W*1.34, cellH=L.H*1.5;
  const col=i%cols, row=Math.floor(i/cols);
  const jx=(Math.random()-0.5)*(cellW-L.W)*0.7, jy=(Math.random()-0.5)*(cellH-L.H)*0.7;
  return {x:Math.round(Math.max(12,24+col*cellW+(cellW-L.W)/2+jx)),y:Math.round(Math.max(12,24+row*cellH+(cellH-L.H)/2+jy)),rot:Math.random()*10-5};
}
function reshuffle(){ const ids=shuf(state.notes.map(n=>n.id)); ids.forEach((id,i)=>{ const n=state.notes.find(m=>m.id===id); const s=scatterSlot(i,ids.length); n.sx=s.x; n.sy=s.y; n.srot=s.rot; }); }
function ensureScatter(){ const miss=state.notes.filter(n=>n.sx==null||n.sy==null); if(!miss.length)return; if(miss.length===state.notes.length){ reshuffle(); } else { const base=state.notes.length; miss.forEach((n,k)=>{ const s=scatterSlot(base+k, state.notes.length+miss.length); n.sx=s.x; n.sy=s.y; n.srot=s.rot; }); } save(); }

function renderShuffle(){

  if(isMobileView()){ renderShuffleMobile(); return; }
  const prev=splitEl.querySelectorAll(".pane"); const sc={l:prev[0]?prev[0].scrollTop:0, ll:prev[0]?prev[0].scrollLeft:0, r:prev[1]?prev[1].scrollTop:0, rl:prev[1]?prev[1].scrollLeft:0};
  splitEl.innerHTML="";

  const left=document.createElement("div"); left.className="pane";
  left.innerHTML='<div class="pane-head"><span class="lbl">メイン</span><span class="sub">本番の配置</span></div>';
  const lb=document.createElement("div"); lb.className="sboard"; left.appendChild(lb); splitEl.appendChild(left);
  curMainBoard=lb; renderInto(lb,"main","ダブルクリックで付箋を追加。");
  lb.addEventListener("dblclick",e=>dblAddOn(lb,"main",e)); attachPan(left);

  const right=document.createElement("div"); right.className="pane";
  const rh=document.createElement("div"); rh.className="pane-head";
  rh.innerHTML='<span class="lbl">シャッフル</span><span class="sub">自由に試す</span><span class="spacer"></span>';
  const bRe=document.createElement("button"); bRe.className="icnbtn"; bRe.textContent="混ぜ直す"; rh.appendChild(bRe); right.appendChild(rh);
  const rb=document.createElement("div"); rb.className="sboard"; right.appendChild(rb); splitEl.appendChild(right);

/* スマホ：シャッフルは全画面の別画面（2分割をやめる） */
function renderShuffleMobile(){
  splitEl.innerHTML="";
  const pane=document.createElement("div"); pane.className="pane";
  const head=document.createElement("div"); head.className="pane-head";
  const back=document.createElement("button"); back.className="icnbtn ghost"; back.textContent="‹ 通常"; back.title="メインに戻る";

  attachPinchZoom(pane,()=>rb); attachPan(pane);
  back.addEventListener("click",()=>setMode("normal"));
  bRe.addEventListener("click",()=>{ pushUndo(snapshot()); reshuffle(); save(); renderInto(rb,"sh"); rb.style.zoom=currentZoom(); toast("混ぜ直しました"); });
}
function setMode(m){ mode=m; if(m==="shuffle")ensureScatter(); render(); }
document.querySelectorAll("#modeToggle button").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));

/* ================= popups ================= */
let openP=null;
function closePop(){ if(openP){openP.remove();openP=null;} const b=document.querySelector(".backdrop"); if(b)b.remove(); }
function makePop(){ const bd=document.createElement("div"); bd.className="backdrop"; bd.addEventListener("click",closePop); bd.addEventListener("contextmenu",e=>{e.preventDefault();closePop();}); document.body.appendChild(bd); const p=document.createElement("div"); p.className="pop"; document.body.appendChild(p); openP=p; return p; }
function place(p,left,top){ requestAnimationFrame(()=>{ if(left+p.offsetWidth>window.innerWidth-8)left=window.innerWidth-8-p.offsetWidth; if(top+p.offsetHeight>window.innerHeight-8)top=Math.max(8,top-p.offsetHeight-2); p.style.left=Math.max(8,left)+"px"; p.style.top=Math.max(8,top)+"px"; }); }
function popup(anchor){ closePop(); const p=makePop(); const r=anchor.getBoundingClientRect(); place(p,r.left,r.bottom+6); return p; }
function popupAtPoint(x,y){ closePop(); const p=makePop(); place(p,x,y); return p; }

function openNoteMenu(n,x,y){
  const p=popupAtPoint(x,y); p.innerHTML='<h4>テーマを変更</h4>';
  state.themes.forEach(t=>{ const row=document.createElement("div"); row.className="row";
    row.innerHTML='<span class="rdot" style="background:'+t.color+'"></span><span class="rtxt">'+esc(t.name)+'</span>'+(t.id===n.themeId?'<span style="color:var(--muted)">✓</span>':'');
    row.addEventListener("click",()=>{ pushUndo(snapshot()); n.themeId=t.id; save(); closePop(); refresh(); }); p.appendChild(row); });
  const div=document.createElement("div"); div.className="div"; p.appendChild(div);
  const del=document.createElement("div"); del.className="menu-item danger"; del.textContent="この付箋を削除";
  del.addEventListener("click",()=>{ closePop(); deleteNote(n); }); p.appendChild(del);
}
function openThemePicker(n,anchor){
  const p=popup(anchor); p.innerHTML='<h4>テーマ</h4>';
  state.themes.forEach(t=>{ const row=document.createElement("div"); row.className="row";
    row.innerHTML='<span class="rdot" style="background:'+t.color+'"></span><span class="rtxt">'+esc(t.name)+'</span>'+(t.id===n.themeId?'<span style="color:var(--muted)">✓</span>':'');
    row.addEventListener("click",()=>{ pushUndo(snapshot()); n.themeId=t.id; save(); closePop(); refresh(); }); p.appendChild(row); });
}
function flash(id){ const el=(curMainBoard||boardEl).querySelector('.note[data-id="'+id+'"]'); if(!el)return; el.scrollIntoView({behavior:"smooth",block:"center"}); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
function openThemeList(t,anchor){
  const p=popup(anchor); p.innerHTML='<h4>'+esc(t.name)+' の付箋</h4>';
  const ns=state.notes.filter(n=>n.themeId===t.id);
  if(!ns.length){ const e=document.createElement("div"); e.className="row"; e.innerHTML='<span class="rtxt mut">まだありません</span>'; p.appendChild(e); return; }
  ns.forEach(n=>{ const row=document.createElement("div"); row.className="row"; const txt=(n.text||"（空の付箋）").split("\n")[0];
    row.innerHTML='<span class="rdot" style="background:'+t.color+'"></span><span class="rtxt'+(n.text?"":" mut")+'">'+esc(txt)+'</span>';
    row.addEventListener("click",()=>{ closePop(); if(mode==="shuffle")setMode("normal"); flash(n.id); }); p.appendChild(row); });
}
function openThemeChipMenu(t,x,y){
  const p=popupAtPoint(x,y); p.style.minWidth="230px"; p.innerHTML='<h4>テーマを編集</h4>';
  const rn=document.createElement("div"); rn.className="row";
  const inp=document.createElement("input"); inp.className="tname"; inp.value=t.name; inp.style.flex="1";
  const commit=()=>{ t.name=inp.value.trim()||"無題"; save(); renderThemeBar(); };
  inp.addEventListener("change",commit); inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){commit();closePop();} });
  rn.appendChild(inp); p.appendChild(rn);
  const sw=document.createElement("div"); sw.className="swatches";
  PALETTE.forEach(c=>{ const s=document.createElement("div"); s.className="sw"; s.style.background=c; if(c===t.color)s.style.outline="2px solid var(--text)";
    s.addEventListener("click",()=>{ t.color=c; save(); renderThemeBar(); if(mode==="normal")renderNormal(); else renderShuffle(); closePop(); }); sw.appendChild(s); });
  p.appendChild(sw);
  const div=document.createElement("div"); div.className="div"; p.appendChild(div);
  const del=document.createElement("div"); del.className="menu-item danger";
  if(state.themes.length<=1){ del.textContent="削除（最後の1つは消せません）"; del.style.opacity=".5"; }
  else{ del.textContent="このテーマを削除"; let armed=false;
    del.addEventListener("click",()=>{ if(!armed){armed=true;del.textContent="もう一度押すと削除（付箋は別テーマへ移動）";return;} pushUndo(snapshot()); const fb=state.themes.find(x=>x!==t).id; state.notes.forEach(n=>{if(n.themeId===t.id)n.themeId=fb;}); state.themes=state.themes.filter(x=>x!==t); save(); closePop(); refresh(); }); }
  p.appendChild(del);
}
function openThemeEditor(anchor){
  const p=popup(anchor); p.style.minWidth="264px"; p.innerHTML='<h4>テーマ（名前をクリックで変更・ドットで色）</h4>';
  state.themes.forEach(t=>{ const row=document.createElement("div"); row.className="row";
    const dot=document.createElement("span"); dot.className="rdot"; dot.style.background=t.color; dot.style.cursor="pointer"; dot.title="色を変更";
    dot.addEventListener("click",ev=>{ ev.stopPropagation(); openSwatch(t,dot); });
    const inp=document.createElement("input"); inp.className="tname"; inp.value=t.name; inp.addEventListener("change",()=>{ t.name=inp.value.trim()||"無題"; save(); renderThemeBar(); });
    const del=document.createElement("button"); del.className="xsm"; del.textContent="×"; del.title="削除";
    del.addEventListener("click",ev=>{ ev.stopPropagation(); if(state.themes.length<=1)return; pushUndo(snapshot()); const fb=state.themes.find(x=>x!==t).id; state.notes.forEach(n=>{if(n.themeId===t.id)n.themeId=fb;}); state.themes=state.themes.filter(x=>x!==t); save(); openThemeEditor(anchor); refresh(); });
    row.appendChild(dot); row.appendChild(inp); row.appendChild(del); p.appendChild(row); });
  const add=document.createElement("div"); add.className="menu-item"; add.textContent="＋ テーマを追加"; add.style.marginTop="4px";
  add.addEventListener("click",()=>{ const used=state.themes.map(t=>t.color); const color=PALETTE.find(c=>!used.includes(c))||PALETTE[state.themes.length%PALETTE.length]; state.themes.push({id:rid("t"),name:"新テーマ",color}); save(); openThemeEditor(anchor); renderThemeBar(); });
  p.appendChild(add);
}
function openSwatch(t,anchor){ const p=popup(anchor); const wrap=document.createElement("div"); wrap.className="swatches";
  PALETTE.forEach(c=>{ const s=document.createElement("div"); s.className="sw"; s.style.background=c; s.addEventListener("click",()=>{ t.color=c; save(); closePop(); renderThemeBar(); refresh(); }); wrap.appendChild(s); }); p.appendChild(wrap); }

document.getElementById("menuBtn").addEventListener("click",e=>{ const p=popup(e.currentTarget);
  [["テーマを編集",()=>openThemeEditor(e.currentTarget)],["エクスポート（全ボード）",doExport],["インポート",()=>document.getElementById("importFile").click()]].forEach(([l,fn])=>{const it=document.createElement("div");it.className="menu-item";it.textContent=l;it.addEventListener("click",()=>{closePop();fn();});p.appendChild(it);}); });

/* ---- スマホ用 ☰ メニュー（畳んだツールバーの中身をまとめる） ---- */
function divEl(){ const d=document.createElement("div"); d.className="div"; return d; }
function openMobileMenu(anchor){
  const p=popup(anchor); p.style.minWidth="240px";
  const h1=document.createElement("h4"); h1.textContent="付箋を追加"; p.appendChild(h1);
  state.themes.forEach(t=>{
    const row=document.createElement("div"); row.className="row";
    row.innerHTML='<span class="rdot" style="background:'+t.color+'"></span><span class="rtxt">'+esc(t.name)+'</span>';
    row.addEventListener("click",()=>{ closePop(); addNoteOfTheme(t.id); });
    p.appendChild(row);
  });
  const addT=document.createElement("div"); addT.className="menu-item"; addT.textContent="＋ 新しいテーマ";
  addT.addEventListener("click",()=>{ const used=state.themes.map(t=>t.color); const color=PALETTE.find(c=>!used.includes(c))||PALETTE[state.themes.length%PALETTE.length]; state.themes.push({id:rid("t"),name:"新テーマ",color}); save(); closePop(); refresh(); });
  p.appendChild(addT);
  p.appendChild(divEl());
  const undo=document.createElement("div"); undo.className="menu-item"; undo.textContent="↶ 元に戻す"; if(!undoStack.length)undo.style.opacity=".4";
  undo.addEventListener("click",()=>{ closePop(); doUndo(); }); p.appendChild(undo);
  const sv=document.createElement("div"); sv.className="menu-item"; sv.textContent="保存"; sv.addEventListener("click",()=>{ closePop(); flushSave(); }); p.appendChild(sv);
  p.appendChild(divEl());
  [["テーマを編集",()=>openThemeEditor(anchor)],["エクスポート（全ボード）",doExport],["インポート",()=>document.getElementById("importFile").click()]].forEach(([l,fn])=>{ const it=document.createElement("div"); it.className="menu-item"; it.textContent=l; it.addEventListener("click",()=>{ closePop(); fn(); }); p.appendChild(it); });
  p.appendChild(divEl());
  if(signedIn){
    const st=document.createElement("div"); st.className="menu-item"; st.style.color="var(--muted)"; st.style.cursor="default"; st.textContent=dirty?"状態：未保存の変更あり":"状態：Driveと保存済み"; p.appendChild(st);
    const sv=document.createElement("div"); sv.className="menu-item"; sv.textContent="Driveに保存（この端末→Drive）"; sv.addEventListener("click",()=>{ closePop(); saveToDrive(); }); p.appendChild(sv);
    const pl=document.createElement("div"); pl.className="menu-item"; pl.textContent="最新を取り込む（Drive→この端末）"; pl.addEventListener("click",()=>{ closePop(); pullFromDrive(); }); p.appendChild(pl);
    const out=document.createElement("div"); out.className="menu-item danger"; out.textContent="ログアウト"; out.addEventListener("click",()=>{ closePop(); signOut(); }); p.appendChild(out);
  }else{
    const login=document.createElement("div"); login.className="menu-item"; login.textContent="☁ Googleでログイン"; login.addEventListener("click",()=>{ closePop(); signIn(); }); p.appendChild(login);
  }
}
document.getElementById("hamburger").addEventListener("click",e=>openMobileMenu(e.currentTarget));

/* ---- 付箋の全画面編集（スマホ） ---- */
let nmNote=null, nmDelArmed=false, nmFontPx=18, _nmPinch=null;
function openNoteFullscreen(n){
  nmNote=n; nmDelArmed=false;
  const modal=document.getElementById("noteModal");
  const card=modal.querySelector(".nm-card");
  const th=themeById(n.themeId), color=th?th.color:"#888";
  card.style.setProperty("--accent",color);
  const b=document.getElementById("nmBody"); b.value=n.text||""; b.style.fontSize=nmFontPx+"px";
  document.getElementById("nmThemebar").hidden=true;
  const d=document.getElementById("nmDel"); d.textContent="×"; d.classList.remove("armed");
  fillNmStars(n);
  updateNmPin();
  modal.hidden=false;
  setTimeout(()=>{ b.focus(); },60);
}
function fillNmStars(n){ const sc=document.getElementById("nmStars"); if(!sc)return; sc.innerHTML=""; sc.appendChild(makeStars(n,()=>fillNmStars(n))); }
function closeNoteFullscreen(){ document.getElementById("noteModal").hidden=true; nmNote=null; refresh(); }
function updateNmPin(){ const b=document.getElementById("nmPin"); if(nmNote)b.textContent=nmNote.pinned?"📌":"📍"; }
function buildNmThemebar(){
  const tb=document.getElementById("nmThemebar"); tb.innerHTML="";
  state.themes.forEach(t=>{ const sw=document.createElement("div"); sw.className="sw"+(nmNote&&t.id===nmNote.themeId?" on":"");
    sw.innerHTML='<span class="d" style="background:'+t.color+'"></span>'+esc(t.name);
    sw.addEventListener("click",()=>{ if(!nmNote)return; pushUndo(snapshot()); nmNote.themeId=t.id; save(); document.querySelector("#noteModal .nm-card").style.setProperty("--accent",t.color); tb.hidden=true; });
    tb.appendChild(sw); });
}
document.getElementById("nmBody").addEventListener("input",e=>{ if(nmNote){ nmNote.text=e.target.value; save(); } });
document.getElementById("nmPin").addEventListener("click",()=>{ if(!nmNote)return; pushUndo(snapshot()); nmNote.pinned=!nmNote.pinned; save(); updateNmPin(); });
document.getElementById("nmDel").addEventListener("click",()=>{ if(!nmNote)return; const d=document.getElementById("nmDel"); if(!nmDelArmed){ nmDelArmed=true; d.textContent="削除"; d.classList.add("armed"); toast("もう一度押すと削除します"); setTimeout(()=>{ nmDelArmed=false; if(d){d.textContent="×";d.classList.remove("armed");} },2500); return; } const n=nmNote; closeNoteFullscreen(); deleteNote(n); });
document.getElementById("nmDot").addEventListener("click",()=>{ const tb=document.getElementById("nmThemebar"); if(tb.hidden){ buildNmThemebar(); tb.hidden=false; } else tb.hidden=true; });
document.getElementById("noteModal").addEventListener("click",e=>{ if(e.target.id==="noteModal") closeNoteFullscreen(); }); // 背景タップで閉じる
// 二本指ピンチで本文の文字サイズを拡大／縮小
(function(){ const b=document.getElementById("nmBody"); const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  b.addEventListener("touchstart",e=>{ if(e.touches.length===2){ _nmPinch={d:dist(e.touches)||1,base:nmFontPx}; } },{passive:false});
  b.addEventListener("touchmove",e=>{ if(e.touches.length===2&&_nmPinch){ e.preventDefault(); let f=_nmPinch.base*(dist(e.touches)/_nmPinch.d); f=Math.max(13,Math.min(46,f)); nmFontPx=Math.round(f); b.style.fontSize=nmFontPx+"px"; } },{passive:false});
  b.addEventListener("touchend",e=>{ if(e.touches.length<2)_nmPinch=null; });
})();

/* export / import */
function doExport(){ const blob=new Blob([JSON.stringify(app,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="monogatari-ban.json"; a.click(); URL.revokeObjectURL(a.href); }
document.getElementById("importFile").addEventListener("change",e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d&&Array.isArray(d.boards)){ d.boards.forEach(normalizeBoard); app=d; } else if(d&&Array.isArray(d.notes)){ app.boards.push(normalizeBoard(d)); } save(); goHome(); }catch(_){}}; r.readAsText(f); e.target.value=""; });

let rz; window.addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(state){ if(mode==="normal")renderNormal(); else renderShuffle(); } },140); });
window.addEventListener("orientationchange",()=>{ userBoardZoom=null; setTimeout(()=>{ if(state){ if(mode==="normal")renderNormal(); else renderShuffle(); } },250); });

document.querySelectorAll(".sync-ui").forEach(b=>b.addEventListener("click",onSyncClick));
attachPinchZoom(stageEl,()=>boardEl); // 通常画面：ピンチでボードを拡大縮小
(async function(){
  app=await loadApp(); if(!app)app={boards:[sampleBoard()]};
  baseRev=parseInt(lsGet("novelboard_baserev")||"0",10)||0;
  dirty=(lsGet("novelboard_dirty")==="1");
  syncState=(lsGet("novelboard_signedin")==="1")?"syncing":"idle";
  goHome(); updateSyncUI();
  resumeSync();
})();
</script>
